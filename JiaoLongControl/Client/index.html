<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LongCore Console</title>
    <script>
      // 启动防闪烁: 必须先于任何样式/渲染执行, 按 localStorage 缓存恢复主题
      // (由 src/theme/theme.ts 在每次解析结果变化时写入); 无缓存时跟随系统深浅色
      try {
        var __jlTheme = localStorage.getItem('jl-theme')
        if (__jlTheme !== 'light' && __jlTheme !== 'dark') {
          __jlTheme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        document.documentElement.dataset.theme = __jlTheme
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      /* 启动遮罩只有两层: 纯底色 + 一个细弧。
       * 底色必须与 WPF 侧 UiTheme.Background() 逐位一致(深 #070b1c / 浅 #e9edf5)——
       * 窗口底色、WebView 底层、页面底色三者同色, 启动过程才不会出现"白一下再变黑"。 */
      :root {
        --loader-bg: #070b1c;
        --loader-arc: #22d3ee;
        --loader-track: rgba(255, 255, 255, 0.12);
      }

      [data-theme='light'] {
        --loader-bg: #e9edf5;
        --loader-arc: #0891b2;
        --loader-track: rgba(13, 14, 21, 0.12);
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--loader-bg);
        font-family:
          'Inter',
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }

      /* 初始 Loading 全屏遮罩: 纯色, 无渐变/无图标/无文案 */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--loader-bg);
        transition: opacity 0.16s linear;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* 20px 细弧: 单色、匀速、无辉光/无缩放/无进度条。
       * 0.45s 后才淡入 —— 加载够快时整屏一动不动, 只有确实在等的时候才有一个动的东西。
       * 旧版的 drop-shadow 辉光 + 双环 + 缩放在首屏和 Vue 抢 GPU, 本身就是"卡"的来源之一。 */
      .loader-spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--loader-track);
        border-top-color: var(--loader-arc);
        opacity: 0;
        animation:
          spin 0.8s linear infinite,
          loader-in 0.24s ease 0.45s forwards;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loader-in {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-spinner {
          animation: loader-in 0.24s ease 0.45s forwards;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div id="app-loader">
      <div class="loader-spinner" role="status" aria-label="正在加载"></div>
    </div>

    <!--
    注意：这里不能用 <script type="module"> 配合顶层 await window.chrome.webview.ready。
    module 脚本按文档顺序执行，且会阻塞 DOMContentLoaded；而 webview.ready 的
    resolve 时机与 DOMContentLoaded 相关，顶层 await 存在死锁风险，会导致
    main.ts 永远不执行、应用白屏。bridge 的就绪等待统一在 utils/bridge.ts 中
    以「调用时惰性获取 + 超时」的方式处理，绝不阻塞模块加载。
-->
    <script>
      // 仅做探测与日志，不阻塞任何后续脚本执行
      try {
        if (window.chrome && window.chrome.webview) {
          console.log('WebView2 detected, readyState: ' + document.readyState)
        } else {
          console.warn('Not running inside WebView2 (bridge will be unavailable)')
        }
      } catch (e) {
        console.warn('WebView2 detection warning', e)
      }
    </script>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
