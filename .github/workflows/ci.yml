name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端构建 (type-check + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JiaoLongControl/Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: JiaoLongControl/Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 行尾由仓库根 .gitattributes 强制 LF；此步防止格式化再次漂移
      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      # 前端关键状态测试（模式三分离 / 写入闸门 / 四态读数 / 温度历史）
      - name: Test (vitest)
        run: npm run test

      - name: Build (vue-tsc + vite build)
        run: npm run build

  backend:
    name: 后端构建 + 协议回归测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AGENTS.md 的「0 警告」门禁：CI 上是全新 runner，等价全量构建
      - name: Build backend (Release, warnings as errors)
        run: dotnet build JiaoLongControl/JiaoLongControl.csproj -c Release -warnaserror

      # SMU 探针工程（--smu-read 等真机排查入口，见 KNOWN_ISSUES 22）也要保持可编译
      - name: Build SMU probe project
        run: dotnet build RyzenSmuControllerTest/RyzenSmuControllerTest.csproj -c Release

      - name: Run protocol golden-sample tests
        run: dotnet run --project ProtocolCodecTest/ProtocolCodecTest.csproj -c Release
