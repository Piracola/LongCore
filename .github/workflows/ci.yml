name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端构建 (type-check + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JiaoLongControl/Client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JiaoLongControl/Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (vue-tsc + vite build)
        run: npm run build

  backend:
    name: 后端构建 + 协议回归测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build backend (Release)
        run: dotnet build JiaoLongControl/JiaoLongControl.csproj -c Release

      - name: Run protocol golden-sample tests
        run: dotnet run --project ProtocolCodecTest/ProtocolCodecTest.csproj -c Release
